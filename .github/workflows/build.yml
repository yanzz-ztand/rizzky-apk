              private fun openSettings() {
                  val box = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(16), dp(8), dp(16), dp(8))
                  }
                  val fields = mutableListOf<Triple<String, String, EditText>>()
                  fun section(t: String, title: String) {
                      box.addView(TextView(this).apply {
                          text = title; setTextColor(cyan); typeface = Typeface.DEFAULT_BOLD
                          setPadding(0, dp(14), 0, dp(4))
                      })
                      val labels = listOf(
                          "prefix" to "Awalan paket",
                          "suffix" to "Akhiran (pisah koma). Kosong = semua paket terpasang yang berawalan itu",
                          "extras" to "Paket tambahan (pisah koma)",
                          "act" to "Nama activity pembuka"
                      )
                      labels.forEach { (f, label) ->
                          box.addView(TextView(this).apply { text = label; textSize = 11f; setTextColor(muted) })
                          val e = EditText(this)
                          e.setText(Cfg.get(this, t, f))
                          e.textSize = 12f
                          e.setSingleLine()
                          box.addView(e)
                          fields.add(Triple(t, f, e))
                      }
