                          putExtra(Intent.EXTRA_MIME_TYPES, arrayOf("image/*", "video/*"))
                      }
                      try { startActivityForResult(i, REQ_WALL) } catch (e: Exception) { toast("Galeri tidak tersedia") }
                  })
                  if (Theme.hasVideo) {
                      val muteBtn = softBtn("") {}
                      fun lbl() {
                          muteBtn.text = if (Theme.muted) "SUARA VIDEO: MUTE (ketuk = UNMUTE)" else "SUARA VIDEO: UNMUTE (ketuk = MUTE)"
