          package com.rizzxy.store

          import android.app.ActivityManager
          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.ComponentName
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.graphics.PixelFormat
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.os.Build
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.provider.Settings
          import android.view.Gravity
          import android.view.View
          import android.view.WindowManager
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.ProgressBar
          import android.widget.TextView

          /** Membuka server satu per satu dalam 1 proses: buka -> tunggu -> nick -> apk berikutnya. Ada PAUSE/PLAY dan STOP. */
          class RunService : Service() {

              companion object {
                  const val EXTRA_PKGS = "pkgs"
                  const val EXTRA_ACT = "act"
                  const val EXTRA_D1 = "d1"
                  const val EXTRA_D2 = "d2"
                  const val EXTRA_CLOSE_END = "closeEnd"

                  @Volatile
                  var running = false
              }

              private val ui = Handler(Looper.getMainLooper())

              @Volatile
              private var stopFlag = false

              @Volatile
              private var paused = false
              private var wm: WindowManager? = null
              private var panel: View? = null
              private var panelLp: WindowManager.LayoutParams? = null
              private var titleTv: TextView? = null
              private var bar: ProgressBar? = null
              private var logTv: TextView? = null
              private val lines = ArrayList<String>()

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  startFg()
                  if (running) return START_NOT_STICKY
                  val pkgs = intent?.getStringArrayListExtra(EXTRA_PKGS) ?: arrayListOf()
                  if (intent == null || pkgs.isEmpty()) {
                      stopSelf()
                      return START_NOT_STICKY
                  }
                  val act = intent.getStringExtra(EXTRA_ACT) ?: Cfg.DEF_ACT
                  val d1 = intent.getIntExtra(EXTRA_D1, 15)
                  val d2 = intent.getIntExtra(EXTRA_D2, 16)
                  val closeEnd = intent.getBooleanExtra(EXTRA_CLOSE_END, false)
                  running = true
                  stopFlag = false
                  paused = false
                  showOverlay()
                  Thread { runAll(pkgs, act, d1, d2, closeEnd) }.start()
                  return START_NOT_STICKY
              }

              private fun startFg() {
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(NotificationChannel("run", "Run", NotificationManager.IMPORTANCE_LOW))
                  val n = Notification.Builder(this, "run")
                      .setContentTitle("Rizzxy Store")
                      .setContentText("Membuka server bergantian")
                      .setSmallIcon(android.R.drawable.ic_media_play)
                      .build()
                  if (Build.VERSION.SDK_INT >= 34) {
                      startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE)
                  } else {
                      startForeground(1, n)
                  }
              }

              private fun runAll(pkgs: List<String>, act: String, d1: Int, d2: Int, closeEnd: Boolean) {
                  // 1 proses saja: buka -> tunggu -> (nick di kunjungan yang sama) -> apk berikutnya.
                  // Setelah apk terakhir selesai cukup Home sekali, tidak ada putaran kedua.
                  val total = pkgs.size
                  val nickMode = Cfg.nickMode(this)
                  var nickNo = Cfg.nickStart(this)
                  var step = 0
                  loop@ for (p in pkgs) {
                      if (!waitIfPaused()) break@loop
                      step++
                      setTitle("[RUN] ${step}/${total}", step * 100 / total)
                      log("OPEN $p (${d1}s)")
                      if (!open(p, act)) {
                          log("SKIP $p (tidak ada activity)")
                          continue
                      }
                      if (!sleepMs(d1 * 1000L)) break@loop
                      if (nickMode != NickAuto.MODE_OFF) {
                          setPanelTouchable(false)
                          val ok = NickAuto.run(this, nickMode, nickNo, { ms -> sleepMs(ms) }, { m -> log(m) })
                          setPanelTouchable(true)
                          if (!ok) break@loop
                          nickNo++
                      }
                  }
                  if (!stopFlag) {
                      goHome()
                      sleepMs(500L)
                  }
                  if (!stopFlag && closeEnd) {
                      pkgs.forEach { kill(it) }
                      log("CLOSE ${pkgs.size} server")
                  }
                  log(if (stopFlag) "STOPPED" else "DONE")
                  ui.postDelayed({ stopSelf() }, 2500)
              }

              /** Panel overlay tidak boleh menangkap ketukan otomatis di area yang sama. */
              private fun setPanelTouchable(on: Boolean) {
                  ui.post {
                      try {
                          val p = panel ?: return@post
                          val lp = panelLp ?: return@post
                          lp.flags = if (on) {
                              lp.flags and WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE.inv()
                          } else {
                              lp.flags or WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE
                          }
                          wm?.updateViewLayout(p, lp)
                      } catch (e: Exception) {
                      }
                  }
              }

              private fun open(pkg: String, act: String): Boolean {
                  return try {
                      val i = Intent().setComponent(ComponentName(pkg, act)).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      if (packageManager.resolveActivity(i, 0) == null) {
                          false
                      } else {
                          startActivity(i)
                          true
                      }
                  } catch (e: Exception) {
                      false
                  }
              }

              private fun goHome() {
                  if (AutoService.home()) return
                  try {
                      val h = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_HOME).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      startActivity(h)
                  } catch (e: Exception) {
                  }
              }

              private fun kill(pkg: String) {
                  try {
                      getSystemService(ActivityManager::class.java).killBackgroundProcesses(pkg)
                  } catch (e: Exception) {
                  }
              }

              private fun sleepMs(ms: Long): Boolean {
                  var left = ms
                  while (left > 0) {
                      if (stopFlag) return false
                      if (paused) {
                          Thread.sleep(100L)
                          continue
                      }
                      val s = if (left > 100L) 100L else left
                      Thread.sleep(s)
                      left -= s
                  }
                  return !stopFlag
              }

              /** Tahan alur selama PAUSE; false kalau dihentikan. */
              private fun waitIfPaused(): Boolean {
                  while (paused && !stopFlag) Thread.sleep(100L)
                  return !stopFlag
              }

              private fun setTitle(t: String, progress: Int) {
                  ui.post {
                      titleTv?.text = if (paused) "[PAUSE] $t" else t
                      bar?.progress = progress
                  }
              }

              private fun log(s: String) {
                  ui.post {
                      lines.add(s)
                      while (lines.size > 6) lines.removeAt(0)
                      logTv?.text = lines.joinToString("\n")
                  }
              }

              private fun showOverlay() {
                  if (!Settings.canDrawOverlays(this)) return
                  val density = resources.displayMetrics.density
                  fun dp(v: Int) = (v * density).toInt()

                  val box = LinearLayout(this)
                  box.orientation = LinearLayout.VERTICAL
                  box.setPadding(dp(10), dp(8), dp(10), dp(8))
                  val bgDraw = GradientDrawable()
                  bgDraw.cornerRadius = dp(12).toFloat()
                  bgDraw.setColor(0xE6081018.toInt())
                  bgDraw.setStroke(dp(1), 0xFFA855F7.toInt())
                  box.background = bgDraw

                  val t = TextView(this)
                  t.text = "[RUN] SIAP"
                  t.setTextColor(0xFFA855F7.toInt())
                  t.textSize = 11f
                  t.typeface = Typeface.DEFAULT_BOLD

                  val b = ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal)
                  b.max = 100

                  val l = TextView(this)
                  l.setTextColor(0xFFDDD6FE.toInt())
                  l.textSize = 9f
                  l.typeface = Typeface.MONOSPACE

                  val play = Button(this)
                  play.text = "⏸ PAUSE"
                  play.textSize = 10f
                  play.setOnClickListener {
                      paused = !paused
                      play.text = if (paused) "▶ PLAY" else "⏸ PAUSE"
                      titleTv?.let { tv ->
                          val base = tv.text.toString().removePrefix("[PAUSE] ")
                          tv.text = if (paused) "[PAUSE] $base" else base
                      }
                  }

                  val stop = Button(this)
                  stop.text = "■ STOP"
                  stop.textSize = 10f
                  stop.setOnClickListener {
                      stopFlag = true
                      paused = false
                      stopSelf()
                  }

                  val btnRow = LinearLayout(this)
                  btnRow.orientation = LinearLayout.HORIZONTAL
                  btnRow.addView(play, LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f))
                  btnRow.addView(stop, LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f))

                  box.addView(t)
                  box.addView(b)
                  box.addView(l)
                  box.addView(btnRow)
                  titleTv = t
                  bar = b
                  logTv = l

                  val lp = WindowManager.LayoutParams(
                      dp(230),
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                      PixelFormat.TRANSLUCENT
                  )
                  lp.gravity = Gravity.TOP or Gravity.END
                  lp.x = dp(8)
                  lp.y = dp(48)
                  try {
                      val w = getSystemService(WINDOW_SERVICE) as WindowManager
                      w.addView(box, lp)
                      wm = w
                      panel = box
                      panelLp = lp
                  } catch (e: Exception) {
                  }
              }

              override fun onDestroy() {
                  stopFlag = true
                  running = false
                  try {
                      val p = panel
                      if (p != null) wm?.removeView(p)
                  } catch (e: Exception) {
                  }
                  panel = null
                  super.onDestroy()
              }
          }
