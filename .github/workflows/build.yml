              private fun rootMode() = Cfg.getInt(this, "accessMode", 0) == 1

              private fun applyMode() {
                  if (!::adbGroup.isInitialized) return
                  val r = rootMode()
                  adbGroup.visibility = if (r) View.GONE else View.VISIBLE
                  rootGroup.visibility = if (r) View.VISIBLE else View.GONE
                  modeBtns.forEachIndexed { i, b -> pill(b, (i == 1) == r) }
                  adbSync()
              }

