              @Deprecated("Deprecated in Java")
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode != REQ_WALL || resultCode != RESULT_OK) return
                  val uri = data?.data ?: return
                  val isVideo = (contentResolver.getType(uri) ?: "").startsWith("video/")
                  toast(if (isVideo) "Menyalin video…" else "Memuat gambar…")
                  Thread {
                      val ok = if (isVideo) Theme.saveVideo(this, uri) else Theme.saveWallpaper(this, uri)
                      runOnUiThread {
                          if (ok) recreate() else toast(if (isVideo) "Gagal memuat video (maks 150 MB)" else "Gagal memuat gambar")
                      }
                  }.start()
              }

              // daftar paket sebuah jenis server yang benar-benar terpasang
              private fun serversOf(t: String): List<String> =
                  Cfg.packages(this, t, all.map { it.pkg }).filter { it in installedSet }

              private fun visible() = all.filter {
                  (filter == 0 || (filter == 1 && !it.system) || (filter == 2 && it.system)) &&
                      (query.isBlank() || it.label.contains(query, true) || it.pkg.contains(query, true))
              }

              private fun refresh() {
                  tabBtns.forEachIndexed { i, b -> pill(b, i == tab) }
                  filterBtns.forEachIndexed { i, b ->
                      b.text = when (i) { 0 -> "ALL (${all.size})"; 1 -> "USER"; else -> "SYSTEM" }
                      pill(b, i == filter)
                  }
                  serverPane.visibility = if (tab == 0 || tab == 1 || tab == 4) View.VISIBLE else View.GONE
                  dataPane.visibility = if (tab == 2) View.VISIBLE else View.GONE
                  adbPane.visibility = if (tab == 3) View.VISIBLE else View.GONE
                  if (tab == 0 || tab == 1 || tab == 4) loadServerTab()
                  if (tab == 3) adbSync()
                  updateBanner()
                  resetBtn.text = "RESET SELECTED DATA (${selected.size})"
                  resetBtn.isEnabled = selected.isNotEmpty()
                  resetBtn.alpha = if (selected.isNotEmpty()) 1f else 0.4f
                  dataAdapter.notifyDataSetChanged()
              }

              private fun updateBanner() {
                  val msg = when {
                      tab == 2 && !dpm.isDeviceOwnerApp(packageName) && !rootMode() ->
                          "Belum jadi Device Owner. Ketuk di sini, lalu pilih ADB atau ROOT di tab ADB/ROOT."
                      (tab == 0 || tab == 1 || tab == 4) && !Settings.canDrawOverlays(this) ->
                          "Izin 'tampil di atas aplikasi lain' belum aktif. Ketuk di sini untuk mengaktifkan."
                      else -> ""
                  }
                  banner.text = msg
                  banner.visibility = if (msg.isEmpty()) View.GONE else View.VISIBLE
                  banner.setOnClickListener {
                      if ((tab == 0 || tab == 1 || tab == 4) && !Settings.canDrawOverlays(this)) requestOverlay()
                      else if (tab == 2 && !dpm.isDeviceOwnerApp(packageName) && !rootMode()) { tab = 3; refresh() }
                  }
              }

              private fun requestOverlay() {
                  startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
              }

              private fun accEnabled(): Boolean {
                  val s = Settings.Secure.getString(contentResolver, Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES)
                      ?: return false
                  val cn = ComponentName(this, AutoService::class.java)
                  val full = cn.flattenToString()
                  val short = cn.flattenToShortString()
                  return s.split(":").any { it.equals(full, true) || it.equals(short, true) }
              }

              // ===== tab NORMAL / ADVANCE =====

              private fun loadServerTab() {
                  val t = type()
                  val byPkg = all.associateBy { it.pkg }
                  serverItems = serversOf(t).mapNotNull { byPkg[it] }
                  selSrv[t]!!.retainAll(serverItems.map { it.pkg }.toSet())
                  refreshServerTitle()
                  refreshAutoSub()
                  srvAdapter.notifyDataSetChanged()
              }

              private fun refreshServerTitle() {
                  srvTitle.text = "${type().uppercase()} · ${serverItems.size} server · dipilih ${selSrv[type()]!!.size}"
              }

              private fun refreshAutoSub() {
                  val t = type()
                  val c = Cfg.getInt(this, "$t.count", if (t == "gift") Cfg.GIFT_COUNT else Cfg.DEF_COUNT)
                  val d1 = Cfg.getInt(this, "$t.d1", if (t == "gift") Cfg.GIFT_D1 else Cfg.DEF_D1)
                  val d2 = Cfg.getInt(this, "$t.d2", if (t == "gift") Cfg.GIFT_D2 else Cfg.DEF_D2)
                  autoSub.text = "$c server · delay ${fmt(d1)}"
              }

              private fun selectAllServers(flag: Boolean) {
                  val s = selSrv[type()]!!
                  if (flag) s.addAll(serverItems.map { it.pkg }) else s.clear()
                  refreshServerTitle()
                  srvAdapter.notifyDataSetChanged()
              }

              /** Buka satu server saja (tanpa urutan). */
              private fun openOne(pkg: String) {
                  val act = Cfg.get(this, type(), "act")
                  try {
                      val i = Intent().setComponent(ComponentName(pkg, act)).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      if (packageManager.resolveActivity(i, 0) == null) toast("Activity tidak ditemukan di $pkg")
                      else startActivity(i)
                  } catch (e: Exception) {
                      toast("Gagal membuka $pkg")
                  }
              }

              private fun startRun() {
                  val t = type()
                  val sel = selSrv[t]!!
                  val checked = serverItems.map { it.pkg }.filter { it in sel }
                  val pool = if (checked.isEmpty()) serverItems.map { it.pkg } else checked
                  val count = Cfg.getInt(this, "$t.count", if (t == "gift") Cfg.GIFT_COUNT else Cfg.DEF_COUNT)
                  val list = pool.take(count)
                  if (list.isEmpty()) { toast("Tidak ada server untuk dibuka"); return }
                  if (!Settings.canDrawOverlays(this)) {
                      toast("Aktifkan izin tampil di atas aplikasi lain dulu")
                      requestOverlay()
                      return
                  }
                  val i = Intent(this, RunService::class.java)
                      .putStringArrayListExtra(RunService.EXTRA_PKGS, ArrayList(list))
                      .putExtra(RunService.EXTRA_ACT, Cfg.get(this, t, "act"))
                      .putExtra(RunService.EXTRA_D1, Cfg.getInt(this, "$t.d1", Cfg.DEF_D1))
                      .putExtra(RunService.EXTRA_D2, 0)
                      .putExtra(RunService.EXTRA_CLOSE_END, Cfg.getInt(this, "$t.closeEnd", 0) == 1)
                  startForegroundService(i)
                  toast("OPEN ${list.size} server")
              }

              private fun closeRun() {
                  stopService(Intent(this, RunService::class.java))
                  val sel = selSrv[type()]!!
                  val list = if (sel.isEmpty()) serverItems.map { it.pkg } else serverItems.map { it.pkg }.filter { it in sel }
                  val am = getSystemService(ActivityManager::class.java)
                  list.forEach {
                      try { am.killBackgroundProcesses(it) } catch (_: Exception) {}
                  }
                  toast("CLOSE ${list.size} server")
              }

