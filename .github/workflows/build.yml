              /**
               * Pindai aplikasi terpasang di thread background. Nama aplikasi disimpan di cache
               * (labels.tsv, dikunci waktu ubah APK) sehingga pembukaan berikutnya jauh lebih cepat;
               * nama yang belum ada di cache dibaca paralel.
               */
              private fun loadAppsAsync(after: () -> Unit) {
                  Thread {
                      val rows = scanApps()
                      runOnUiThread {
                          all = rows
                          installedSet = rows.map { it.pkg }.toSet()
                          after()
                      }
                  }.start()
              }

              private fun scanApps(): List<AppRow> {
                  val pm = packageManager
                  val cacheFile = File(filesDir, "labels.tsv")
                  val cache = HashMap<String, Pair<Long, String>>()
                  try {
                      if (cacheFile.exists()) cacheFile.forEachLine { ln ->
                          val p = ln.split('\t', limit = 3)
                          if (p.size == 3) cache[p[0]] = (p[1].toLongOrNull() ?: 0L) to p[2]
                      }
                  } catch (_: Exception) {
                  }
                  val infos = pm.getInstalledApplications(0)
                  val labels = HashMap<String, String>()
                  val stamps = HashMap<String, Long>()
                  val todo = ArrayList<ApplicationInfo>()
                  for (ai in infos) {
                      val stamp = try { File(ai.sourceDir).lastModified() } catch (_: Exception) { 0L }
                      stamps[ai.packageName] = stamp
                      val c = cache[ai.packageName]
                      if (c != null && c.first == stamp) labels[ai.packageName] = c.second else todo.add(ai)
                  }
                  if (todo.isNotEmpty()) {
                      val pool = Executors.newFixedThreadPool(4)
                      try {
                          val jobs = todo.map { ai ->
                              Callable {
                                  ai.packageName to (try { ai.loadLabel(pm).toString() } catch (_: Exception) { ai.packageName })
                              }
                          }
                          for (f in pool.invokeAll(jobs)) {
                              try {
                                  val r = f.get()
                                  labels[r.first] = r.second
                              } catch (_: Exception) {
                              }
                          }
                      } finally {
                          pool.shutdown()
                      }
                      try {
                          cacheFile.writeText(infos.joinToString("\n") { ai ->
                              val l = (labels[ai.packageName] ?: ai.packageName).replace('\t', ' ').replace('\n', ' ')
                              ai.packageName + "\t" + (stamps[ai.packageName] ?: 0L) + "\t" + l
                          })
                      } catch (_: Exception) {
                      }
                  }
                  return infos
                      .map {
                          AppRow(it.packageName, labels[it.packageName] ?: it.packageName,
                              it.flags and ApplicationInfo.FLAG_SYSTEM != 0)
                      }
                      .sortedBy { it.label.lowercase() }
              }

