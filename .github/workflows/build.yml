          cat > 'app/src/main/java/com/rizzxy/store/VideoBg.kt' <<'RZX_EOF'
          package com.rizzxy.store

          import android.content.Context
          import android.graphics.Matrix
          import android.graphics.SurfaceTexture
          import android.media.AudioAttributes
          import android.media.MediaPlayer
          import android.view.Surface
          import android.view.TextureView
          import java.io.File

          /** Wallpaper video: diputar berulang, memenuhi layar (center-crop), suara bisa mute / unmute. */
          class VideoBg(ctx: Context, private val file: File, muted: Boolean) :
              TextureView(ctx), TextureView.SurfaceTextureListener {

              private var mp: MediaPlayer? = null
              private var surface: Surface? = null
              private var vw = 0
              private var vh = 0
              private var ready = false

              var isMuted: Boolean = muted
                  set(v) {
                      field = v
                      applyVolume()
                  }

              init {
                  surfaceTextureListener = this
              }

              private fun applyVolume() {
                  val x = if (isMuted) 0f else 1f
                  try { mp?.setVolume(x, x) } catch (_: Exception) {}
              }

              private fun begin(st: SurfaceTexture) {
                  release()
                  try {
                      val s = Surface(st)
                      surface = s
                      val m = MediaPlayer()
                      mp = m
                      m.setSurface(s)
                      m.setAudioAttributes(
                          AudioAttributes.Builder()
                              .setUsage(AudioAttributes.USAGE_MEDIA)
                              .setContentType(AudioAttributes.CONTENT_TYPE_MOVIE)
                              .build()
                      )
                      m.setDataSource(file.absolutePath)
                      m.isLooping = true
                      m.setOnVideoSizeChangedListener { _, w, h ->
                          vw = w; vh = h
                          fit()
                      }
                      m.setOnPreparedListener { p ->
                          ready = true
                          applyVolume()
                          try { p.start() } catch (_: Exception) {}
                      }
                      m.setOnErrorListener { _, _, _ -> true }
                      m.prepareAsync()
                  } catch (e: Exception) {
                      release()
                  }
              }

              /** Skala supaya video menutup seluruh view tanpa terdistorsi. */
              private fun fit() {
                  val w = width.toFloat()
                  val h = height.toFloat()
                  if (vw <= 0 || vh <= 0 || w <= 0f || h <= 0f) return
                  val scale = Math.max(w / vw, h / vh)
                  val m = Matrix()
                  m.setScale(vw * scale / w, vh * scale / h, w / 2f, h / 2f)
                  setTransform(m)
              }

              fun pausePlayback() {
                  try { if (ready) mp?.pause() } catch (_: Exception) {}
              }

              fun resumePlayback() {
                  try { if (ready) mp?.start() } catch (_: Exception) {}
              }

              fun release() {
                  ready = false
                  try { mp?.release() } catch (_: Exception) {}
                  mp = null
                  try { surface?.release() } catch (_: Exception) {}
                  surface = null
              }

              override fun onSurfaceTextureAvailable(st: SurfaceTexture, w: Int, h: Int) = begin(st)

              override fun onSurfaceTextureSizeChanged(st: SurfaceTexture, w: Int, h: Int) = fit()

              override fun onSurfaceTextureDestroyed(st: SurfaceTexture): Boolean {
                  release()
                  return true
              }

              override fun onSurfaceTextureUpdated(st: SurfaceTexture) {}
          }
