                  var d1 = Cfg.getInt(this, "$t.d1", if (t == "gift") Cfg.GIFT_D1 else Cfg.DEF_D1).coerceIn(2, 120)
                  var d2 = Cfg.getInt(this, "$t.d2", if (t == "gift") Cfg.GIFT_D2 else Cfg.DEF_D2).coerceIn(0, 120)
                  var closeEnd = Cfg.getInt(this, "$t.closeEnd", 0) == 1
