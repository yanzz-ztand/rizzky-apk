              private class CaptureView(c: Context, val onPick: (Float, Float) -> Unit) : View(c) {
                  var px = -1f
                  var py = -1f
                  private val ring = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      color = Color.RED
                      style = Paint.Style.STROKE
                      strokeWidth = 4f
                  }
                  private val dot = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.YELLOW }

                  override fun onTouchEvent(e: MotionEvent): Boolean {
                      val a = e.actionMasked
                      if (a == MotionEvent.ACTION_DOWN || a == MotionEvent.ACTION_MOVE || a == MotionEvent.ACTION_UP) {
                          px = e.rawX
                          py = e.rawY
