                      .setPositiveButton("SIMPAN") { _, _ ->
                          fields.forEach { (t, f, e) -> Cfg.set(this, t, f, e.text.toString()) }
                          refresh()
                          toast("Tersimpan")
                      }
                      .show()
              }

