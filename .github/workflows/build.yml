              // ===== tema custom: warna + wallpaper =====

              private var videoBg: VideoBg? = null

              private fun withWallpaper(content: View): View {
                  val vf = Theme.videoFile(this)
                  val wp = Theme.wallpaper
                  if (wp == null && !(Theme.hasVideo && vf.exists())) return content
                  val fl = FrameLayout(this)
                  fl.setBackgroundColor(bg)
                  if (wp == null) {
                      val v = VideoBg(this, vf, Theme.muted)
                      videoBg = v
                      fl.addView(v, FrameLayout.LayoutParams(-1, -1))
                  } else {
                      fl.addView(ImageView(this).apply {
                          setImageBitmap(wp)
                          scaleType = ImageView.ScaleType.CENTER_CROP
                      }, FrameLayout.LayoutParams(-1, -1))
                  }
                  fl.addView(View(this).apply { setBackgroundColor(Theme.dimColor()) }, FrameLayout.LayoutParams(-1, -1))
                  fl.addView(content, FrameLayout.LayoutParams(-1, -1))
                  return fl
              }

              private val REQ_WALL = 77

              private fun toggleMute() {
                  Theme.setMuted(this, !Theme.muted)
                  videoBg?.isMuted = Theme.muted
                  toast(if (Theme.muted) "Suara video: MUTE" else "Suara video: UNMUTE")
              }

