          package com.rizzxy.store

          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Context
          import android.util.DisplayMetrics
          import android.view.WindowManager

          /** Menjalankan alur tap nickname (RANDOM / REQUEST). Dipakai RunService (RUN 2) dan tombol TES. */
          object NickAuto {
              const val MODE_OFF = 0
              const val MODE_RANDOM = 1
              const val MODE_REQUEST = 2

              fun nickFor(c: Context, no: Int): String = Cfg.nickText(c) + "%03d".format(no)

              private fun setClip(c: Context, text: String) {
                  try {
                      val cm = c.getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                      cm.setPrimaryClip(ClipData.newPlainText("nick", text))
                  } catch (e: Exception) {
                  }
              }

              /**
               * @param sleep tidur ms, mengembalikan false kalau dihentikan
               * @return false kalau dihentikan di tengah jalan, true kalau selesai (atau dilewati)
               */
              fun run(c: Context, mode: Int, no: Int, sleep: (Long) -> Boolean, log: (String) -> Unit): Boolean {
                  if (mode == MODE_OFF) return true
                  if (!AutoService.ready() && RootHelper.rooted != true) {
                      log("NICK dilewati: Accessibility belum aktif")
                      return true
                  }
                  val flow: String
                  if (mode == MODE_REQUEST) {
                      val nick = nickFor(c, no)
                      setClip(c, nick)
                      log("NICK $nick")
                      flow = Cfg.nickFlow(c)
                      if (!sleep(300L)) return false
                  } else {
                      log("NICK acak (ketuk)")
                      flow = Cfg.nickRFlow(c)
                  }
                  if (!sleep(Cfg.nickPre(c) * 1000L)) return false

                  val dm = DisplayMetrics()
                  @Suppress("DEPRECATION")
                  (c.getSystemService(Context.WINDOW_SERVICE) as WindowManager).defaultDisplay.getRealMetrics(dm)
                  val gap = Cfg.nickGapMs(c).toLong()

                  for (raw in flow.lines()) {
                      val ln = raw.trim()
                      if (ln.isEmpty() || ln.startsWith("#")) continue
                      if (ln.startsWith("~")) {
                          val sec = ln.substring(1).trim().toDoubleOrNull() ?: continue
                          if (!sleep((sec * 1000).toLong())) return false
                          continue
                      }
                      if (ln.startsWith("@") || ln.startsWith("!")) {
                          val longPress = ln.startsWith("!")
                          var body = ln.substring(1)
                          var times = 1
                          val star = body.indexOf('*')
                          if (star >= 0) {
                              times = body.substring(star + 1).trim().toIntOrNull() ?: 1
                              body = body.substring(0, star)
                          }
                          val xy = body.split(",")
                          if (xy.size < 2) continue
                          val fx = xy[0].trim().toFloatOrNull() ?: continue
                          val fy = xy[1].trim().toFloatOrNull() ?: continue
                          val px = fx.coerceIn(0f, 1f) * dm.widthPixels
                          val py = fy.coerceIn(0f, 1f) * dm.heightPixels
                          val dur = if (longPress) 900L else 60L
                          for (k in 0 until times.coerceIn(1, 200)) {
                              if (!AutoService.tap(px, py, dur)) {
                                  log("KETUK gagal")
                                  return true
                              }
                              if (!sleep(dur + gap)) return false
                          }
                      }
                  }
                  if (!sleep(Cfg.nickAfter(c) * 1000L)) return false
                  return true
              }
          }
