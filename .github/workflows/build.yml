          package com.rizzxy.store

          import android.content.Context
          import android.provider.Settings
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL
          import java.security.MessageDigest

          /**
           * Kunci akses online: token diperiksa ke server (Vercel "rizky-database").
           * Token diatur lewat halaman admin: kedaluwarsa, batas perangkat, nonaktifkan, dll.
           * Status aktif disimpan di data app; app memeriksa ulang ke server secara berkala.
           */
          object Lock {
              /** Alamat server token. Ganti kalau domain proyek Vercel-mu berbeda. */
              const val API_BASE = "https://rizky-database.vercel.app"

              /** Boleh offline maksimal 72 jam sejak verifikasi sukses terakhir. */
              private const val GRACE_MS = 72L * 3600_000L

              /** Periksa ulang ke server paling sering tiap 5 menit. */
              private const val RECHECK_MS = 5L * 60_000L

              /** net = true berarti gagal karena jaringan/server (bukan penolakan token). */
              class Result(val ok: Boolean, val exp: Long = 0L, val reason: String = "", val net: Boolean = false)

              private fun sp(c: Context) = c.getSharedPreferences("lock", Context.MODE_PRIVATE)

              /** Waktu efektif: jam HP tidak bisa dimundurkan untuk memperpanjang token. */
              private fun nowMs(c: Context): Long {
                  val p = sp(c)
                  val last = p.getLong("seen", 0L)
                  val eff = maxOf(System.currentTimeMillis(), last)
                  if (eff > last) p.edit().putLong("seen", eff).apply()
                  return eff
              }

              /** ID perangkat (dipakai server untuk membatasi jumlah HP per token). */
              fun deviceId(c: Context): String {
                  val raw = Settings.Secure.getString(c.contentResolver, Settings.Secure.ANDROID_ID) ?: "x"
                  val h = MessageDigest.getInstance("SHA-256").digest(("RZX|" + raw).toByteArray())
                  val hex = h.joinToString("") { "%02X".format(it) }
                  return hex.substring(0, 4) + "-" + hex.substring(4, 8)
              }

              /** Periksa token ke server. Panggil dari thread background. */
              fun verify(c: Context, token: String): Result {
                  return try {
                      val con = URL(API_BASE + "/api?op=verify").openConnection() as HttpURLConnection
                      con.requestMethod = "POST"
                      con.connectTimeout = 10000
                      con.readTimeout = 15000
                      con.doOutput = true
                      con.setRequestProperty("Content-Type", "application/json")
                      val body = JSONObject().put("token", token).put("device", deviceId(c)).toString()
                      con.outputStream.use { it.write(body.toByteArray()) }
                      val code = con.responseCode
                      val stream = if (code in 200..299) con.inputStream else con.errorStream
                      val text = stream?.bufferedReader()?.use { it.readText() } ?: ""
                      con.disconnect()
                      val j = try { JSONObject(text) } catch (e: Exception) { null }
                      if (j == null) {
                          Result(false, reason = "Server tidak merespons dengan benar ($code)", net = true)
                      } else if (j.optBoolean("ok")) {
                          Result(true, j.optLong("exp", 0L))
                      } else {
                          Result(false, reason = j.optString("reason", "Token ditolak"), net = j.optBoolean("temp", false))
                      }
                  } catch (e: Exception) {
                      Result(false, reason = "Tidak bisa terhubung ke server. Periksa internet.", net = true)
                  }
              }

              private fun lockOut(p: android.content.SharedPreferences, note: String) {
                  p.edit().putBoolean("ok", false).putString("note", note).apply()
              }

              fun isUnlocked(c: Context): Boolean {
                  val p = sp(c)
                  if (!p.getBoolean("v4", false)) {
                      // buang status dari skema lama (token offline)
                      p.edit().putBoolean("v4", true).putBoolean("ok", false).apply()
                  }
                  if (!p.getBoolean("ok", false)) return false
                  val now = nowMs(c)
                  val exp = p.getLong("exp", 0L)
                  if (exp > 0L && now > exp) {
                      lockOut(p, "Token kedaluwarsa, masukkan token baru.")
                      return false
                  }
                  if (now - p.getLong("lastOk", 0L) > GRACE_MS) {
                      lockOut(p, "Terlalu lama offline. Sambungkan internet lalu masukkan token lagi.")
                      return false
                  }
                  return true
              }

              /** Simpan token yang sudah terverifikasi. */
              fun save(c: Context, token: String, exp: Long) {
                  val now = nowMs(c)
                  sp(c).edit()
                      .putBoolean("ok", true)
                      .putString("token", token.trim())
                      .putLong("exp", exp)
                      .putLong("lastOk", now)
                      .putLong("checked", now)
                      .remove("note")
                      .apply()
              }

              /** Pesan alasan terkunci (sekali pakai), atau string kosong. */
              fun takeNote(c: Context): String {
                  val p = sp(c)
                  val n = p.getString("note", "") ?: ""
                  if (n.isNotEmpty()) p.edit().remove("note").apply()
                  return n
              }

              /**
               * Periksa ulang token di server (maks tiap 5 menit). Kalau server menolak
               * (dinonaktifkan / kedaluwarsa / dihapus), kunci lagi dan panggil onLocked.
               * Gagal jaringan tidak mengunci app (ada toleransi offline 72 jam).
               */
              fun revalidate(c: Context, onLocked: () -> Unit) {
                  val p = sp(c)
                  if (!p.getBoolean("ok", false)) return
                  val now = nowMs(c)
                  if (now - p.getLong("checked", 0L) < RECHECK_MS) return
                  p.edit().putLong("checked", now).apply()
                  val token = p.getString("token", "") ?: ""
                  Thread {
                      val r = verify(c, token)
                      if (r.ok) {
                          sp(c).edit().putLong("exp", r.exp).putLong("lastOk", nowMs(c)).apply()
                      } else if (!r.net) {
                          lockOut(sp(c), r.reason)
                          onLocked()
                      }
                  }.start()
              }
          }
