              /**
               * Aktifkan layanan Aksesibilitas (izin ketuk layar) otomatis tanpa buka Pengaturan:
               * beri WRITE_SECURE_SETTINGS lewat ROOT / ADB, lalu tulis daftar layanan aktif.
               */
              private fun enableAccAuto(viaRoot: Boolean) {
                  adbAsync("AKTIFKAN AKSESIBILITAS") {
                      val grant = "pm grant $packageName android.permission.WRITE_SECURE_SETTINGS"
                      val raw: String
                      if (viaRoot) {
                          raw = RootHelper.run(grant)
                      } else {
                          if (!AdbHelper.connected) throw IllegalStateException("Belum terhubung ke ADB")
                          raw = AdbHelper.run(this, grant)
                      }
                      val out = raw.trim()
                      if (out.isNotEmpty()) AdbHelper.log(out)
                      if (out.contains("Exception", true) || out.contains("Error", true)) {
                          throw IllegalStateException(out.lines().firstOrNull().orEmpty().take(120))
                      }
                      val cn = ComponentName(this, AutoService::class.java)
                      val full = cn.flattenToString()
                      val short = cn.flattenToShortString()
                      val cur = Settings.Secure.getString(contentResolver, Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES) ?: ""
                      if (!cur.split(":").any { it.equals(full, true) || it.equals(short, true) }) {
                          val nv = if (cur.isEmpty()) full else "$cur:$full"
                          Settings.Secure.putString(contentResolver, Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES, nv)
                      }
                      Settings.Secure.putInt(contentResolver, Settings.Secure.ACCESSIBILITY_ENABLED, 1)
                      AdbHelper.log("Aksesibilitas Rizzxy Store aktif")
                  }
              }

              private fun adbAsync(label: String, work: () -> Unit) {
                  AdbHelper.log("▶ $label")
                  Thread {
                      try {
                          work()
                          AdbHelper.log("✓ $label")
                      } catch (e: Throwable) {
                          AdbHelper.log("✕ $label: " + (e.message ?: e.javaClass.simpleName))
                      }
                      runOnUiThread { updateBanner(); adbSync() }
                  }.start()
              }

              /** Segarkan status, log, dan isi kolom port dari hasil deteksi. */
              private fun adbSync() {
                  if (!::adbLog.isInitialized) return
                  val owner = dpm.isDeviceOwnerApp(packageName)
                  val good: Boolean
                  val head: String
                  if (rootMode()) {
                      val r = RootHelper.rooted
                      good = r == true
                      head = "ROOT: " + when (r) { true -> "TERSEDIA ✓"; false -> "TIDAK ADA"; null -> "BELUM DICEK" }
                  } else {
                      good = AdbHelper.connected
                      head = if (AdbHelper.connected) "ADB: TERHUBUNG ✓" else "ADB: BELUM TERHUBUNG"
                  }
                  adbStatus.text = head + "   ·   Device Owner: " + (if (owner) "YA ✓" else "TIDAK")
                  adbStatus.setTextColor(if (good) green else white)
                  val pp = AdbHelper.pairPort
                  if (pp > 0 && adbPairPort.text.toString() != pp.toString()) adbPairPort.setText(pp.toString())
                  val cp = AdbHelper.connPort
                  if (cp > 0 && adbConnPort.text.toString() != cp.toString()) adbConnPort.setText(cp.toString())
                  adbLog.text = AdbHelper.logText().ifEmpty { "(belum ada aktivitas)" }
              }

