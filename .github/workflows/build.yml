                  modeBtn.setOnClickListener {
                      val lp = captureLp ?: return@setOnClickListener
                      val picking = (lp.flags and WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE) == 0
                      lp.flags = if (picking) {
                          lp.flags or WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE
                      } else {
                          lp.flags and WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE.inv()
                      }
                      try {
                          wm?.updateViewLayout(capture, lp)
                      } catch (e: Exception) {
                      }
                      modeBtn.text = if (picking) "MODE: MAIN GAME" else "MODE: PILIH"
                  }
                  val clearBtn = Button(app)
                  clearBtn.text = "HAPUS"
                  clearBtn.textSize = 10f
                  clearBtn.setOnClickListener {
                      points.clear()
                      label.text = "daftar titik dikosongkan"
                  }
                  val closeBtn = Button(app)
                  closeBtn.text = "TUTUP"
                  closeBtn.textSize = 10f
                  closeBtn.setOnClickListener {
                      val n = points.size
                      hide()
                      Toast.makeText(app, "$n titik disalin. Tempel di EDIT ALUR TAP", Toast.LENGTH_LONG).show()
                  }
                  row.addView(modeBtn)
                  row.addView(clearBtn)
                  row.addView(closeBtn)
                  box.addView(row)

                  val panelLp = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                      PixelFormat.TRANSLUCENT
                  )
                  panelLp.gravity = Gravity.TOP or Gravity.START
                  panelLp.x = (8 * density).toInt()
                  panelLp.y = (8 * density).toInt()

