               * Daftar paket satu jenis server.
               * - akhiran diisi  -> awalan + tiap akhiran (urutan sesuai tulisan)
               * - akhiran kosong -> semua paket terpasang yang diawali awalan
               * Lalu ditambah paket tambahan.
               */
              fun packages(c: Context, type: String, installed: List<String>): List<String> {
                  val prefix = get(c, type, "prefix")
                  val suffixes = get(c, type, "suffix").split(",").map { it.trim() }.filter { it.isNotEmpty() }
                  val extras = get(c, type, "extras").split(",", "\n", " ").map { it.trim() }.filter { it.isNotEmpty() }
                  val base: List<String> = when {
                      prefix.isEmpty() -> emptyList()
                      suffixes.isEmpty() -> installed.filter { it.startsWith(prefix) }.sorted()
                      else -> suffixes.map { prefix + it }
                  }
                  return (base + extras).distinct()
              }
