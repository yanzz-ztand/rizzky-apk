          cat > 'app/src/main/java/com/rizzxy/store/Theme.kt' <<'RZX_EOF'
          package com.rizzxy.store

          import android.content.Context
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.graphics.Color
          import android.net.Uri
          import java.io.File

          /**
           * Tema custom: warna (geser hue dari palet dasar ungu) + wallpaper background.
           * Semua warna UI dasarnya ungu; t() menggeser hue-nya sesuai tema yang dipilih.
           */
          object Theme {
              const val BASE_HUE = 271f

              /** nama preset -> hue */
              val presets = listOf(
                  "UNGU" to 271f, "BIRU" to 217f, "TOSCA" to 180f, "HIJAU" to 145f,
                  "KUNING" to 45f, "ORANYE" to 25f, "MERAH" to 350f, "PINK" to 320f
              )

              @Volatile var hue = BASE_HUE
                  private set
              /** 0 ringan, 1 sedang, 2 gelap */
              @Volatile var dim = 1
                  private set
              @Volatile var wallpaper: Bitmap? = null
                  private set

              /** true kalau wallpaper berupa video (file wallpaper.mp4 ada). */
              @Volatile var hasVideo = false
                  private set
              /** suara video: default mute */
              @Volatile var muted = true
                  private set

              val hasWall: Boolean get() = wallpaper != null || hasVideo

              fun videoFile(c: Context): File = File(c.filesDir, "wallpaper.mp4")

              private fun sp(c: Context) = c.getSharedPreferences("theme", Context.MODE_PRIVATE)
              private fun wallFile(c: Context) = File(c.filesDir, "wallpaper.jpg")

              fun load(c: Context) {
                  hue = sp(c).getFloat("hue", BASE_HUE)
                  dim = sp(c).getInt("dim", 1)
                  muted = sp(c).getBoolean("muted", true)
                  hasVideo = videoFile(c).exists()
                  wallpaper = if (hasVideo) null else try {
                      val f = wallFile(c)
                      if (f.exists()) BitmapFactory.decodeFile(f.absolutePath) else null
                  } catch (e: Throwable) {
                      null
                  }
              }

              fun setMuted(c: Context, m: Boolean) {
                  muted = m
                  sp(c).edit().putBoolean("muted", m).apply()
              }

              /** Salin video pilihan jadi wallpaper (maks 150 MB). Panggil dari thread background. */
              fun saveVideo(c: Context, uri: Uri): Boolean {
                  val tmp = File(c.filesDir, "wallpaper.tmp")
                  return try {
                      var total = 0L
                      val limit = 150L * 1024 * 1024
                      c.contentResolver.openInputStream(uri)?.use { ins ->
                          tmp.outputStream().use { out ->
                              val buf = ByteArray(64 * 1024)
                              while (true) {
                                  val n = ins.read(buf)
                                  if (n < 0) break
                                  total += n
                                  if (total > limit) throw IllegalStateException("terlalu besar")
                                  out.write(buf, 0, n)
                              }
                          }
                      } ?: return false
                      val dst = videoFile(c)
                      dst.delete()
                      if (!tmp.renameTo(dst)) return false
                      try { wallFile(c).delete() } catch (_: Exception) {}
                      wallpaper = null
                      hasVideo = true
                      true
                  } catch (e: Throwable) {
                      try { tmp.delete() } catch (_: Exception) {}
                      false
                  }
              }

              fun setHue(c: Context, h: Float) {
                  hue = ((h % 360f) + 360f) % 360f
                  sp(c).edit().putFloat("hue", hue).apply()
              }

              fun setDim(c: Context, d: Int) {
                  dim = d.coerceIn(0, 2)
                  sp(c).edit().putInt("dim", dim).apply()
              }

              /** Hue dari kode warna (#RRGGBB) buatan pengguna; null kalau tidak valid. */
              fun hueOf(hex: String): Float? {
                  return try {
                      val col = Color.parseColor(if (hex.startsWith("#")) hex else "#$hex")
                      val hsv = FloatArray(3)
                      Color.colorToHSV(col, hsv)
                      hsv[0]
                  } catch (e: Exception) {
                      null
                  }
              }

              /** Geser hue warna dasar (ungu) ke hue tema. */
              fun t(base: Int): Int {
                  val delta = hue - BASE_HUE
                  if (Math.abs(delta) < 0.5f) return base
                  val hsv = FloatArray(3)
                  Color.colorToHSV(base, hsv)
                  hsv[0] = ((hsv[0] + delta) % 360f + 360f) % 360f
                  return Color.HSVToColor(Color.alpha(base), hsv)
              }

              /** Warna permukaan (kartu/panel): sedikit transparan kalau ada wallpaper. */
              fun s(base: Int): Int {
                  val c = t(base)
                  return if (hasWall) Color.argb(0xB8, Color.red(c), Color.green(c), Color.blue(c)) else c
              }

              /** Lapisan gelap di atas wallpaper supaya teks tetap terbaca. */
              fun dimColor(): Int = when (dim) {
                  0 -> 0x40000000
                  2 -> 0xA0000000.toInt()
                  else -> 0x70000000
              }

              /** Simpan gambar pilihan (diperkecil) sebagai wallpaper. Panggil dari thread background. */
              fun saveWallpaper(c: Context, uri: Uri): Boolean {
                  return try {
                      val opt = BitmapFactory.Options().apply { inJustDecodeBounds = true }
                      c.contentResolver.openInputStream(uri)?.use { BitmapFactory.decodeStream(it, null, opt) }
                      var sample = 1
                      while (opt.outWidth / sample > 1600 || opt.outHeight / sample > 1600) sample *= 2
                      val o2 = BitmapFactory.Options().apply { inSampleSize = sample }
                      val bmp = c.contentResolver.openInputStream(uri)?.use { BitmapFactory.decodeStream(it, null, o2) }
                          ?: return false
                      wallFile(c).outputStream().use { bmp.compress(Bitmap.CompressFormat.JPEG, 88, it) }
                      try { videoFile(c).delete() } catch (_: Exception) {}
                      hasVideo = false
                      wallpaper = bmp
                      true
                  } catch (e: Throwable) {
                      false
                  }
              }

              fun clearWallpaper(c: Context) {
                  try { wallFile(c).delete() } catch (_: Exception) {}
                  try { videoFile(c).delete() } catch (_: Exception) {}
                  hasVideo = false
                  wallpaper = null
              }
          }
