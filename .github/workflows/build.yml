                  fun applyHue(h: Float) { Theme.setHue(this, h); dlg.dismiss(); recreate() }

                  label("WARNA TEMA")
                  val rows = Theme.presets.chunked(4)
                  for (row in rows) {
                      val lr = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
