          package com.rizzxy.store

          import java.util.concurrent.TimeUnit

          /**
           * Akses ROOT langsung (tanpa ADB): jalankan perintah shell lewat `su`.
           * Dipakai untuk set Device Owner dan hapus data aplikasi (pm clear).
           */
          object RootHelper {

              /** null = belum dicek, true = root tersedia, false = tidak ada / ditolak. */
              @Volatile
              var rooted: Boolean? = null
                  private set

              private val pkgRe = Regex("^[A-Za-z0-9._]+$")

              /** Jalankan satu perintah sebagai root. Kembalikan output gabungan (stdout+stderr). */
              fun run(cmd: String, timeoutSec: Long = 30): String {
                  val p = try {
                      ProcessBuilder("su", "-c", cmd).redirectErrorStream(true).start()
                  } catch (e: Exception) {
                      rooted = false
                      throw IllegalStateException("Perintah su tidak ditemukan (HP belum root)")
                  }
                  var out = ""
                  val reader = Thread { out = p.inputStream.bufferedReader().readText() }
                  reader.start()
                  if (!p.waitFor(timeoutSec, TimeUnit.SECONDS)) {
                      p.destroyForcibly()
                      throw IllegalStateException("Perintah root timeout (cek izin root di Magisk/KernelSU)")
                  }
                  reader.join(2000)
                  return out
              }

              /** Cek apakah izin root diberikan (akan memunculkan dialog Magisk/KernelSU). */
              fun check(): Boolean {
                  val ok = try {
                      run("id", 20).contains("uid=0")
                  } catch (e: IllegalStateException) {
                      rooted = false
                      throw e
                  }
                  rooted = ok
                  return ok
              }

              /** Hapus data satu aplikasi (setara "Clear data"). */
              fun clearData(pkg: String): Boolean {
                  if (!pkgRe.matches(pkg)) return false
                  return run("pm clear $pkg", 30).contains("Success", true)
              }

              fun setDeviceOwner(pkg: String): String =
                  run("dpm set-device-owner $pkg/.AdminReceiver", 30).trim()
          }
