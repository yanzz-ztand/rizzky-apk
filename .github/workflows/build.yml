                  val targets = selected.toList()
                  val tv = TextView(this).apply {
                      typeface = Typeface.MONOSPACE; textSize = 11f; setTextColor(cyan)
                      setPadding(dp(16), dp(12), dp(16), dp(12))
                      text = buildString {
                          append("$ rizzxy-cli --reset --targets=${targets.size}\n")
                          append(if (viaRoot) "> MODE: ROOT DIRECT PURGE\n" else "> MODE: DEVICE OWNER DIRECT PURGE\n")
                          append("> SELECTED TARGET LIST:\n")
                          targets.forEach { append("  • $it\n") }
                      }
                  }
                  AlertDialog.Builder(this)
                      .setTitle("RIZZXY // CONSOLE")
                      .setView(ScrollView(this).apply { addView(tv) })
                      .setNegativeButton("CANCEL", null)
                      .setPositiveButton("EXECUTE") { _, _ -> if (viaRoot) executeRoot(targets) else execute(targets) }
                      .show()
              }

              private fun execute(targets: List<String>) {
                  val ex = Executors.newSingleThreadExecutor()
                  var done = 0
                  var ok = 0
                  fun step(success: Boolean) {
                      runOnUiThread {
                          done++; if (success) ok++
                          if (done == targets.size) {
                              toast("CLEARED $ok APPS" + if (ok < done) " (${done - ok} gagal)" else "")
                              selected.clear(); refresh()
                          }
                      }
                  }
                  for (p in targets) {
                      try {
                          dpm.clearApplicationUserData(admin, p, ex) { _, success -> step(success) }
                      } catch (e: Exception) {
                          step(false)
                      }
                  }
              }

              private fun executeRoot(targets: List<String>) {
                  Thread {
                      var ok = 0
                      for (p in targets) {
                          try { if (RootHelper.clearData(p)) ok++ } catch (e: Exception) {
                              AdbHelper.log("✕ clear $p: " + (e.message ?: e.javaClass.simpleName))
                          }
                      }
                      runOnUiThread {
                          toast("CLEARED $ok APPS" + if (ok < targets.size) " (${targets.size - ok} gagal)" else "")
                          selected.clear(); refresh()
                      }
                  }.start()
              }

              private fun confirmReleaseOwner() {
                  if (!dpm.isDeviceOwnerApp(packageName)) return
                  AlertDialog.Builder(this)
                      .setTitle("Lepas Device Owner?")
                      .setMessage("Aplikasi ini tidak lagi bisa menghapus data aplikasi lain sampai di-set ulang lewat adb.")
                      .setNegativeButton("BATAL", null)
                      .setPositiveButton("LEPAS") { _, _ ->
                          @Suppress("DEPRECATION") dpm.clearDeviceOwnerApp(packageName)
                          toast("Device Owner dilepas")
                      }.show()
              }

