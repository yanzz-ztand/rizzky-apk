              private fun startPicker() {
                  if (!Settings.canDrawOverlays(this)) {
                      toast("Aktifkan izin overlay dulu")
                      requestOverlay()
                      return
                  }
                  toast("Pindah ke game. Overlay muncul 6 detik lagi")
                  android.os.Handler(mainLooper).postDelayed({ PointPicker.show(this) }, 6000L)
              }

              private fun testNick() {
                  val mode = Cfg.nickMode(this)
                  if (mode == NickAuto.MODE_OFF) {
                      toast("Pilih RANDOM atau REQUEST dulu")
                      return
                  }
                  if (!accEnabled() && RootHelper.rooted != true) {
                      toast("Aktifkan 'Rizzxy Store' di Accessibility dulu (atau pakai tombol AKTIFKAN AKSESIBILITAS di tab ADB/ROOT)")
                      startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                      return
                  }
                  toast("TES mulai 8 detik lagi. Pindah ke layar nickname di game")
                  val app = applicationContext
                  Thread {
                      val sl: (Long) -> Boolean = { ms ->
                          try {
                              Thread.sleep(ms)
                              true
                          } catch (e: InterruptedException) {
                              false
                          }
                      }
                      if (sl(8000L)) {
                          NickAuto.run(app, mode, Cfg.nickStart(app), sl) { m -> runOnUiThread { toast(m) } }
                      }
                  }.start()
              }

