          package com.rizzxy.store

          import android.app.RemoteInput
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent

          /** Menerima kode pairing yang diketik dari notifikasi, lalu pairing + connect otomatis. */
          class PairReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent) {
                  val code = RemoteInput.getResultsFromIntent(intent)
                      ?.getCharSequence("code")?.toString()?.trim().orEmpty()
                  val app = context.applicationContext
                  if (code.length != 6) {
                      AdbHelper.postStatus(app, "Kode harus 6 digit")
                      return
                  }
                  val pending = goAsync()
                  Thread {
                      try {
                          AdbHelper.pairAndConnect(app, code, "", 0, 0)
                          AdbHelper.postStatus(app, "Pairing dan connect berhasil")
                          AdbHelper.stopDiscovery()
                      } catch (e: Throwable) {
                          AdbHelper.log("✕ " + (e.message ?: e.javaClass.simpleName))
                          AdbHelper.postStatus(app, "Gagal: " + (e.message ?: "lihat tab ADB"))
                      } finally {
                          pending.finish()
                      }
                  }.start()
              }
          }
