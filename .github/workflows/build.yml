                  override fun onDraw(canvas: Canvas) {
                      if (px < 0f) return
                      val loc = IntArray(2)
                      getLocationOnScreen(loc)
                      val x = px - loc[0]
                      val y = py - loc[1]
                      canvas.drawCircle(x, y, 40f, ring)
                      canvas.drawCircle(x, y, 6f, dot)
