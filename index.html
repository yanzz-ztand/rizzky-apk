<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Rizky Database · Token</title>
<style>
:root{--bg:#0b0714;--card:#1a1030;--card2:#130b24;--line:#4c2a7a;--ac:#a855f7;--ac2:#c084fc;--tx:#ede9fe;--mu:#a59bc4;--ok:#34d399;--bad:#f87171;--warn:#fbbf24}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:14px;max-width:760px;margin-inline:auto}
h1{font-size:18px;letter-spacing:.08em;margin:6px 0 2px;color:var(--ac2)}
.sub{color:var(--mu);font-size:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
label{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--mu);margin:10px 0 5px}
input{width:100%;background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit}
input:focus{outline:2px solid var(--ac)}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
button{background:var(--ac);color:#1e0b3a;border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:700;cursor:pointer}
button.soft{background:#3b1a66;color:var(--ac2)}
button.bad{background:#7f1d1d;color:#fff}
button.sm{padding:6px 10px;font-size:12px}
button:disabled{opacity:.5}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{padding:5px 11px;border-radius:99px;background:var(--card2);border:1px solid var(--line);color:var(--mu);font-size:12px;font-weight:700;cursor:pointer}
.chip.on{background:#4c1d95;color:var(--tx)}
.code{font:700 15px ui-monospace,Menlo,Consolas,monospace;word-break:break-all;color:var(--tx)}
.tag{display:inline-block;font-size:11px;font-weight:800;padding:2px 8px;border-radius:99px;margin-left:6px;vertical-align:middle}
.aktif{background:#064e3b;color:var(--ok)}.nonaktif{background:#7f1d1d;color:#fecaca}.kedaluwarsa{background:#78350f;color:var(--warn)}
.meta{color:var(--mu);font-size:12px;margin:6px 0}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.msg{font-size:13px;margin:8px 0}.err{color:var(--bad)}.good{color:var(--ok)}
textarea{width:100%;min-height:90px;background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:10px;font:13px ui-monospace,Menlo,monospace}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function () {
  var app = document.getElementById('app');
  var S = { key: sessionStorage.getItem('rzx_admin') || '', tokens: [], now: Date.now(), filter: 'semua', q: '', made: '', err: '', info: '' };

  function h(tag, attrs, kids) {
    var el = document.createElement(tag);
    attrs = attrs || {};
    Object.keys(attrs).forEach(function (k) {
      if (k === 'class') el.className = attrs[k];
      else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), attrs[k]);
      else if (k === 'value') el.value = attrs[k];
      else el.setAttribute(k, attrs[k]);
    });
    (kids || []).forEach(function (c) { el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return el;
  }

  function api(action, data) {
    var body = Object.assign({ action: action }, data || {});
    return fetch('/api?op=admin', {
      method: 'POST',
      headers: { 'content-type': 'application/json', 'x-admin-key': S.key },
      body: JSON.stringify(body)
    }).then(function (r) { return r.json().then(function (j) { j._status = r.status; return j; }); });
  }

  function fmt(ms) {
    if (!ms) return 'tanpa batas';
    return new Date(ms).toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
  }
  function left(t) {
    if (!t.exp) return '';
    var d = Math.ceil((t.exp - S.now) / 86400000);
    return d >= 0 ? ' · sisa ' + d + ' hari' : '';
  }
  function copy(txt) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(function () { flash('Disalin'); }, function () { prompt('Salin manual:', txt); });
    } else { prompt('Salin manual:', txt); }
  }
  function flash(m) { S.info = m; render(); setTimeout(function () { if (S.info === m) { S.info = ''; render(); } }, 1800); }

  function load() {
    return api('list').then(function (j) {
      if (j._status === 401 || j._status === 429 || j.ok === false) {
        S.err = j.reason || 'Gagal memuat';
        if (j._status === 401) { S.key = ''; sessionStorage.removeItem('rzx_admin'); }
        S.tokens = [];
      } else { S.err = ''; S.tokens = j.tokens; S.now = j.now; }
      render();
    }).catch(function () { S.err = 'Tidak bisa terhubung ke server'; render(); });
  }

  function loginView() {
    var inp = h('input', { type: 'password', placeholder: 'Admin key', autocomplete: 'current-password' });
    function go() {
      S.key = inp.value.trim();
      if (!S.key) return;
      sessionStorage.setItem('rzx_admin', S.key);
      load();
    }
    inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') go(); });
    return h('div', {}, [
      h('h1', {}, ['RIZKY DATABASE']),
      h('div', { class: 'sub' }, ['Atur token akses Rizzxy Store']),
      h('div', { class: 'card' }, [
        h('label', {}, ['ADMIN KEY']), inp,
        h('div', { class: 'msg err' }, [S.err]),
        h('div', { style: 'margin-top:10px' }, [h('button', { onclick: go }, ['MASUK'])])
      ])
    ]);
  }

  function createCard() {
    var count = h('input', { type: 'number', value: '5', min: '1', max: '100' });
    var days = h('input', { type: 'number', value: '30', min: '0' });
    var maxd = h('input', { type: 'number', value: '1', min: '0' });
    var note = h('input', { placeholder: 'mis. pembeli A', maxlength: '80' });
    var custom = h('input', { placeholder: 'kosong = acak, mis. RIZZXY', maxlength: '40' });
    var btn = h('button', {}, ['BUAT TOKEN']);
    btn.addEventListener('click', function () {
      btn.disabled = true;
      api('create', { count: +count.value, days: +days.value, maxDevices: +maxd.value, note: note.value, custom: custom.value })
        .then(function (j) {
          btn.disabled = false;
          if (j.ok) {
            S.made = j.made.join('\n') + '\n\nBerlaku: ' + fmt(j.exp);
            S.err = '';
            return load();
          }
          S.err = j.reason || 'Gagal membuat'; render();
        }).catch(function () { btn.disabled = false; S.err = 'Tidak bisa terhubung ke server'; render(); });
    });
    var made = [];
    if (S.made) {
      var ta = h('textarea', { readonly: 'readonly' }); ta.value = S.made;
      made = [ta, h('div', { class: 'acts' }, [
        h('button', { class: 'sm', onclick: function () { copy(S.made.split('\n\n')[0]); } }, ['SALIN SEMUA']),
        h('button', { class: 'sm soft', onclick: function () { S.made = ''; render(); } }, ['TUTUP'])
      ])];
    }
    return h('div', { class: 'card' }, [
      h('div', { class: 'sub' }, ['BUAT TOKEN BARU']),
      h('div', { class: 'row' }, [h('div', {}, [h('label', {}, ['JUMLAH']), count]), h('div', {}, [h('label', {}, ['DURASI (HARI, 0 = TANPA BATAS)']), days])]),
      h('div', { class: 'row' }, [h('div', {}, [h('label', {}, ['MAKS PERANGKAT (0 = TAK TERBATAS)']), maxd]), h('div', {}, [h('label', {}, ['CATATAN']), note])]),
      h('label', {}, ['KODE CUSTOM (OPSIONAL, 1 TOKEN)']), custom,
      h('div', { style: 'margin-top:12px' }, [btn])
    ].concat(made));
  }

  function tokenCard(t) {
    function upd(data, confirmMsg) {
      if (confirmMsg && !confirm(confirmMsg)) return;
      api('update', Object.assign({ code: t.code }, data)).then(function (j) {
        if (!j.ok) { S.err = j.reason || 'Gagal'; render(); } else load();
      });
    }
    var devs = (t.devices || []).length + '/' + (t.maxDevices > 0 ? t.maxDevices : '∞') + ' perangkat';
    var acts = [
      h('button', { class: 'sm', onclick: function () { copy(t.code); } }, ['SALIN']),
      h('button', { class: 'sm soft', onclick: function () {
        var d = prompt('Perpanjang berapa hari?', '30');
        if (d && +d > 0) upd({ extendDays: +d });
      } }, ['PERPANJANG']),
      h('button', { class: 'sm soft', onclick: function () { upd({ revoked: !t.revoked }); } }, [t.revoked ? 'AKTIFKAN' : 'NONAKTIFKAN']),
      h('button', { class: 'sm soft', onclick: function () {
        var m = prompt('Batas perangkat (0 = tak terbatas):', String(t.maxDevices));
        if (m !== null && m !== '' && +m >= 0) upd({ maxDevices: +m });
      } }, ['BATAS HP']),
      h('button', { class: 'sm soft', onclick: function () { upd({ resetDevices: true }, 'Reset daftar perangkat token ini?'); } }, ['RESET HP'])
    ];
    if (t.exp) acts.push(h('button', { class: 'sm soft', onclick: function () { upd({ permanent: true }, 'Jadikan tanpa batas waktu?'); } }, ['TANPA BATAS']));
    acts.push(h('button', { class: 'sm bad', onclick: function () {
      if (!confirm('Hapus token ' + t.code + '?')) return;
      api('delete', { code: t.code }).then(load);
    } }, ['HAPUS']));
    return h('div', { class: 'card' }, [
      h('div', {}, [h('span', { class: 'code' }, [t.code]), h('span', { class: 'tag ' + t.status }, [t.status.toUpperCase()])]),
      h('div', { class: 'meta' }, [
        'Berlaku s/d ' + fmt(t.exp) + left(t) + ' · ' + devs + ' · dipakai ' + (t.uses || 0) + 'x',
        t.lastUsed ? ' · terakhir ' + fmt(t.lastUsed) : '',
        t.note ? ' · ' + t.note : ''
      ]),
      h('div', { class: 'acts' }, acts)
    ]);
  }

  function dashView() {
    var list = S.tokens.filter(function (t) {
      if (S.filter !== 'semua' && t.status !== S.filter) return false;
      var q = S.q.trim().toUpperCase();
      return !q || t.code.toUpperCase().indexOf(q) >= 0 || (t.note || '').toUpperCase().indexOf(q) >= 0;
    });
    var cnt = function (s) { return S.tokens.filter(function (t) { return t.status === s; }).length; };
    var search = h('input', { placeholder: 'Cari kode / catatan', value: S.q });
    search.addEventListener('input', function () { S.q = search.value; var p = search.selectionStart; render(); var n = document.querySelector('input[placeholder="Cari kode / catatan"]'); if (n) { n.focus(); n.setSelectionRange(p, p); } });
    var chips = ['semua', 'aktif', 'kedaluwarsa', 'nonaktif'].map(function (f) {
      return h('span', { class: 'chip' + (S.filter === f ? ' on' : ''), onclick: function () { S.filter = f; render(); } },
        [f.toUpperCase() + (f === 'semua' ? ' ' + S.tokens.length : ' ' + cnt(f))]);
    });
    return h('div', {}, [
      h('div', { class: 'top' }, [
        h('div', {}, [h('h1', {}, ['RIZKY DATABASE']), h('div', { class: 'sub' }, ['Token akses Rizzxy Store'])]),
        h('button', { class: 'sm soft', onclick: function () { S.key = ''; sessionStorage.removeItem('rzx_admin'); S.tokens = []; render(); } }, ['KELUAR'])
      ]),
      h('div', { class: 'msg ' + (S.err ? 'err' : 'good') }, [S.err || S.info]),
      createCard(),
      search,
      h('div', { class: 'chips' }, chips)
    ].concat(list.length ? list.map(tokenCard) : [h('div', { class: 'sub' }, ['Belum ada token.'])]));
  }

  function render() {
    app.textContent = '';
    app.appendChild(S.key && (S.tokens.length || !S.err) ? dashView() : loginView());
  }

  render();
  if (S.key) load();
})();
</script>
</body>
</html>
